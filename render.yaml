services:
  - type: web
    name: task-aura
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-aura-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: task-aura-db
    plan: free
